{% extends 'base.html' %}

{% block title %}
Список команд
{% endblock title %}

{% block content %}
<div class="card-group">
    {% for team in obj_list %}
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">{{ team.name }} <span>| {{ team.count_members }} работников</span></h5>
            <p class="card-text"><small class="text-body-secondary">{{ team.created_at }}</small></p>
            <a class="btn btn-primary" href="{% url 'teams:team_detail' team.pk %}">Подробнее</a>
        </div>
    </div>
    {% endfor %}
</div>
<div>
    {% include 'includes/paginator.html' %}
</div>
{% endblock content %}
